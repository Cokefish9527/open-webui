name: ci-minimal

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '**' ]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint (ruff) — non-blocking
        run: |
          ruff check . || true

      - name: Run minimal E2E smoke tests
        env:
          E2E_SMOKE: '1'
        run: |
          pytest -q tests_e2e_smoke

