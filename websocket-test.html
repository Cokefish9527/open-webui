<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWebUI Socket.IO 调试面板</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(135deg, #eff6ff, #fdf2f8);
            padding: 18px 28px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 24px 24px;
            gap: 16px;
            min-height: 0;
        }

        .tab-bar {
            display: inline-flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px;
            border-radius: calc(var(--radius) + 4px);
            box-shadow: var(--shadow);
            align-self: flex-start;
        }

        .tab-button {
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tab-button:hover {
            color: var(--text);
            border-color: rgba(37, 99, 235, 0.2);
        }

        .tab-button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
        }

        .tab-panels {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .tab-panel {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            gap: 16px;
            padding-right: 4px;
        }

        .tab-panel.active {
            display: flex;
        }

        .tab-panel[hidden] {
            display: none;
        }

        .panel-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            overflow: auto;
            padding-right: 4px;
            scrollbar-gutter: stable both-edges;
        }

        .panel-grid.single {
            grid-template-columns: minmax(0, 1fr);
        }

        .panel-grid .span-2 {
            grid-column: span 2;
        }

        @media (max-width: 1024px) {
            body {
                overflow: auto;
            }
            main {
                padding: 12px 16px 16px;
            }
            .tab-bar {
                align-self: stretch;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            .tab-panels {
                position: static;
            }
            .tab-panel {
                position: static;
                padding-right: 0;
            }
            .panel-grid {
                grid-template-columns: minmax(0, 1fr);
                overflow: visible;
                padding-right: 0;
            }
            .panel-grid .span-2 {
                grid-column: span 1;
            }
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button.primary {
            background: var(--primary);
            color: #fff;
        }

        button.primary:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        button.secondary:hover {
            background: #d1d9e6;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        @keyframes spin {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .toggle-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #94a3b8;
            box-shadow: 0 0 0 6px rgba(148, 163, 184, 0.25);
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.3);
        }

        .token-box {
            border: 1px dashed #cbd5f5;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            color: var(--muted);
            background: #f8fafc;
            min-height: 48px;
        }

        .scrollable {
            overflow-y: auto;
            padding-right: 4px;
        }

        .conversation-toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .conversation-body {
            flex: 1;
            min-height: 0;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
        }

        .metric-card h4 {
            margin: 0 0 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .metric-card strong {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
    </style>
</head>
<body>
<header>
    <h1>OpenWebUI Socket.IO 调试面板</h1>
    <p>通过顶部标签在连接配置、消息调试与监控面板间切换，所有核心功能均可在单屏完成。</p>
</header>
<main>
    <div class="tab-bar" role="tablist">
        <button type="button" class="tab-button active" data-tab="connection" aria-selected="true">连接与订阅</button>
        <button type="button" class="tab-button" data-tab="messaging" aria-selected="false">消息调试</button>
        <button type="button" class="tab-button" data-tab="monitor" aria-selected="false">监控面板</button>
    </div>
    <div class="tab-panels">
        <section class="tab-panel active" data-tab-panel="connection" role="tabpanel" aria-label="连接与订阅">
            <div class="panel-grid">
                <section class="card">
                    <h2>连接与登录</h2>
                    <div class="grid-2">
                        <div>
                            <label for="serverUrl">服务器地址</label>
                            <input id="serverUrl" type="text" placeholder="http://localhost:8080">
                        </div>
                        <div>
                            <label for="loginEmail">账号邮箱</label>
                            <input id="loginEmail" type="text" placeholder="saiter2306001@163.com">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label for="loginPassword">登录密码</label>
                            <input id="loginPassword" type="password" placeholder="hsai1234">
                        </div>
                        <div>
                            <label for="userId">用户 ID（登录成功自动同步）</label>
                            <input id="userId" type="text" placeholder="登录后自动填充" readonly>
                        </div>
                    </div>
                    <div class="toggle-line">
                        <input id="autoLogin" type="checkbox">
                        <label for="autoLogin">页面加载后自动登录</label>
                    </div>
                    <div class="toggle-line">
                        <input id="autoConnect" type="checkbox">
                        <label for="autoConnect">登录成功后自动连接 Socket</label>
                    </div>
                    <div class="button-row">
                        <button id="loginBtn" class="primary">登录</button>
                        <button id="refreshTokenBtn" class="secondary">刷新 Token</button>
                        <button id="logoutBtn" class="secondary" disabled>退出登录</button>
                    </div>
                    <div class="button-row">
                        <button id="connectBtn" class="primary">连接 Socket</button>
                        <button id="disconnectBtn" class="secondary" disabled>断开连接</button>
                        <button id="clearStorageBtn" class="secondary">清空本地缓存</button>
                    </div>
                    <div class="status-line" aria-live="polite">
                        <span id="connectionDot" class="status-dot"></span>
                        <span id="connectionStatus">未连接</span>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label>Socket ID</label>
                            <input id="socketId" type="text" placeholder="连接后自动显示" readonly>
                        </div>
                        <div>
                            <label>当前 Token 信息</label>
                            <div id="tokenInfo" class="token-box">尚未登录</div>
                        </div>
                    </div>
                    <div class="button-row">
                        <button id="importConfigBtn" class="secondary">导入配置</button>
                        <button id="exportConfigBtn" class="secondary">导出配置</button>
                        <input id="configFileInput" type="file" accept="application/json" style="display:none;">
                    </div>
                </section>
                <section class="card">
                    <h2>事件订阅</h2>
                    <div id="subscriptionList" class="scrollable" style="max-height: 220px;"></div>
                    <div class="button-row">
                        <button id="selectAllSubscriptionsBtn" class="secondary">全选</button>
                        <button id="clearSubscriptionsBtn" class="secondary">全不选</button>
                    </div>
                    <div>
                        <strong>Engine.IO 心跳</strong>
                        <p id="pingInfo" style="margin: 0; color: var(--muted); font-size: 12px;">等待连接...</p>
                    </div>
                </section>
            </div>
        </section>
        <section class="tab-panel" data-tab-panel="messaging" role="tabpanel" aria-label="消息调试" hidden>
            <div class="panel-grid">
                <section class="card">
                    <h2>消息发送</h2>
                    <div class="grid-2">
                        <div>
                            <label for="messageType">消息类型</label>
                            <select id="messageType">
                                <option value="chat">chat</option>
                                <option value="welcome">welcome</option>
                                <option value="workflow_trigger">workflow_trigger</option>
                                <option value="hsai_status">hsai_status</option>
                            </select>
                        </div>
                        <div>
                            <label for="entryType">入口类型</label>
                            <input id="entryType" type="text" placeholder="chat / company_info">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label for="sessionId">Session ID</label>
                            <input id="sessionId" type="text" placeholder="留空自动生成">
                        </div>
                        <div class="toggle-line" style="margin-top: 28px;">
                            <input id="lockSession" type="checkbox">
                            <label for="lockSession">锁定当前会话</label>
                        </div>
                    </div>
                    <div>
                        <label for="messageContent">消息正文</label>
                        <textarea id="messageContent" placeholder="请输入发送内容"></textarea>
                    </div>
                    <div>
                        <label for="metadataInput">附加元数据（JSON）</label>
                        <textarea id="metadataInput" placeholder='{"test_mode": true}'></textarea>
                        <p class="helper-text">留空将发送空对象；无效 JSON 会自动忽略并提示。</p>
                    </div>
                    <div>
                        <label for="taskId">任务 ID（可选）</label>
                        <input id="taskId" type="text" placeholder="task_xxx">
                    </div>
                    <div class="button-row">
                        <button id="sendMessageBtn" class="primary">发送消息</button>
                        <button id="sendWelcomeBtn" class="secondary">发送欢迎语</button>
                        <button id="sendStatusBtn" class="secondary">查询系统状态</button>
                    </div>
                    <div>
                        <strong>模板快捷填充</strong>
                        <div id="templateList" class="scrollable" style="max-height: 140px; font-size: 13px; color: var(--muted);"></div>
                    </div>
                </section>
                <section class="card span-2">
                    <div class="conversation-toolbar">
                        <div>
                            <h2 style="margin: 0;">会话记录</h2>
                            <small style="color: var(--muted);">按会话分组，支持展开查看原始 JSON。</small>
                        </div>
                        <div class="filters">
                            <select id="conversationFilter">
                                <option value="all">全部会话</option>
                            </select>
                            <select id="eventFilter">
                                <option value="all">全部事件</option>
                                <option value="sent">仅发送</option>
                                <option value="hsai_response">仅响应</option>
                                <option value="hsai_error">仅错误</option>
                            </select>
                            <button id="clearMessagesBtn" class="secondary">清空记录</button>
                            <button id="exportLogsBtn" class="secondary">导出记录</button>
                        </div>
                    </div>
                    <div id="conversationContainer" class="conversation-body"></div>
                </section>
            </div>
        </section>
        <section class="tab-panel" data-tab-panel="monitor" role="tabpanel" aria-label="监控面板" hidden>
            <div class="panel-grid">
                <section class="card">
                    <h2>指标统计</h2>
                    <div class="metrics">
                        <div class="metric-card">
                            <h4>发送次数</h4>
                            <strong id="statSent">0</strong>
                        </div>
                        <div class="metric-card">
                            <h4>接收次数</h4>
                            <strong id="statReceived">0</strong>
                        </div>
                        <div class="metric-card">
                            <h4>错误次数</h4>
                            <strong id="statErrors">0</strong>
                        </div>
                        <div class="metric-card">
                            <h4>平均往返 (ms)</h4>
                            <strong id="statAvgLatency">-</strong>
                        </div>
                        <div class="metric-card">
                            <h4>最小 / 最大 (ms)</h4>
                            <strong id="statLatencyRange">-</strong>
                        </div>
                        <div class="metric-card">
                            <h4>最近往返 (ms)</h4>
                            <strong id="statLatestLatency">-</strong>
                        </div>
                    </div>
                    <div>
                        <strong>最近事件</strong>
                        <div id="recentEvents" class="scrollable" style="max-height: 140px; font-size: 12px; color: var(--muted);"></div>
                    </div>
                </section>
                <section class="card">
                    <h2>请求重放队列</h2>
                    <div id="replayContainer" class="scrollable" style="max-height: 240px;"></div>
                </section>
            </div>
        </section>
    </div>
</main>
    <script defer src="static/ws-tester.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const TAB_STORAGE_KEY = "openwebui_ws_tester_active_tab";
            const buttons = Array.from(document.querySelectorAll("[data-tab]"));
            const panels = Array.from(document.querySelectorAll("[data-tab-panel]"));

            if (!buttons.length || !panels.length) {
                return;
            }

            const panelKeys = new Set(panels.map((panel) => panel.dataset.tabPanel));
            const stored = localStorage.getItem(TAB_STORAGE_KEY);
            const fallback = buttons[0].dataset.tab;
            const initial = stored && panelKeys.has(stored) ? stored : fallback;

            const activateTab = (tab) => {
                buttons.forEach((btn) => {
                    const active = btn.dataset.tab === tab;
                    btn.classList.toggle("active", active);
                    btn.setAttribute("aria-selected", active ? "true" : "false");
                });

                panels.forEach((panel) => {
                    const active = panel.dataset.tabPanel === tab;
                    panel.classList.toggle("active", active);
                    if (active) {
                        panel.removeAttribute("hidden");
                    } else {
                        panel.setAttribute("hidden", "");
                    }
                });
            };

            activateTab(initial);

            buttons.forEach((btn) => {
                btn.addEventListener("click", () => {
                    const tab = btn.dataset.tab;
                    if (!tab || btn.classList.contains("active")) {
                        return;
                    }
                    activateTab(tab);
                    localStorage.setItem(TAB_STORAGE_KEY, tab);
                });
            });
        });
    </script>
</body>
</html>
