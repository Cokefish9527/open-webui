version: '3.8'

services:
  open-webui-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: open-webui-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - WEBUI_SECRET_KEY=
      # UGC asset upload fallback (when STORAGE_PROVIDER=local and no public URL can be generated)
      - USE_FFMPEG_OSS=true
      - FFMPEG_API_BASE_URL=http://192.168.20.32:8082
      - FFMPEG_OSS_API_PREFIX=/api/v1
      - UGC_ASSET_OSS_PATH_PREFIX=ugc/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  backend-data:
